<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Cacao</title>
    <script src="/_sdk/data_sdk.js"></script>
    <script src="/_sdk/element_sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100%;
        }

        html {
            height: 100%;
        }

        .module-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .module-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .form-section {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <style>
        @view-transition {
            navigation: auto;
        }
    </style>
</head>

<body class="h-full">
    <header class="flex items-center justify-center p-4 bg-white shadow-md">
        <img src="logo.png" alt="AgriGold Logo" class="h-12 mr-2">
        <h1 class="text-2xl font-bold">AgriGold</h1>
    </header>
    <div id="app" class="h-full flex flex-col"></div>
    <script>
        const defaultConfig = {
            app_title: "Sistema de Gestión de Cacao",
            farm_name: "Mi Finca Cacaotera",
            welcome_message: "Gestiona tu cultivo de cacao de forma profesional",
            primary_color: "#8B4513",
            secondary_color: "#D2691E",
            background_color: "#F5F1E8",
            text_color: "#2C1810",
            accent_color: "#CD853F"
        };

        let allRecords = [];
        let currentView = 'dashboard';
        let currentModule = null;
        let isLoading = false;

        const modules = [
            { id: 'vivero', name: 'Vivero', icon: '🌱', description: 'Gestión de plántulas' },
            { id: 'siembra', name: 'Siembra', icon: '🌾', description: 'Lotes productivos' },
            { id: 'fertilizacion', name: 'Fertilización', icon: '💧', description: 'Control de nutrientes' },
            { id: 'fitosanitario', name: 'Fitosanitario', icon: '🐛', description: 'Plagas y enfermedades' },
            { id: 'poda', name: 'Poda', icon: '✂️', description: 'Mantenimiento de plantas' },
            { id: 'cosecha', name: 'Cosecha', icon: '🌰', description: 'Registro de producción' },
            { id: 'postcosecha', name: 'Postcosecha', icon: '🏗️', description: 'Fermentación y secado' },
            { id: 'costos', name: 'Costos', icon: '💰', description: 'Compras e inventario' },
            { id: 'mano_obra', name: 'Mano de Obra', icon: '👨‍🌾', description: 'Jornales y pagos' },
            { id: 'equipos', name: 'Equipos', icon: '🚜', description: 'Maquinaria y mantenimiento' },
            { id: 'analitica', name: 'Analítica', icon: '📊', description: 'Reportes y KPIs' },
            { id: 'geo', name: 'Georreferenciación', icon: '📍', description: 'Mapeo de lotes' }
        ];

        const dataHandler = {
            onDataChanged(data) {
                allRecords = data;
                renderCurrentView();
            }
        };

        async function initApp() {
            const result = await window.dataSdk.init(dataHandler);
            if (!result.isOk) {
                console.error("Error al inicializar SDK");
            }
        }

        function renderCurrentView() {
            const app = document.getElementById('app');

            if (currentView === 'dashboard') {
                app.innerHTML = renderDashboard();
            } else if (currentView === 'module') {
                app.innerHTML = renderModule(currentModule);
            }

            attachEventListeners();
        }

        function renderDashboard() {
            const config = window.elementSdk?.config || defaultConfig;
            const stats = calculateStats();

            return `
                <div class="h-full flex flex-col" style="background-color: ${config.background_color};">
                    <!-- Header -->
                    <header class="shadow-md" style="background-color: ${config.primary_color};">
                        <div class="px-6 py-4">
                            <h1 class="text-3xl font-bold text-white">${config.app_title}</h1>
                            <p class="text-white text-opacity-90 mt-1">${config.farm_name}</p>
                        </div>
                    </header>

                    <!-- Main Content -->
                    <main class="flex-1 overflow-y-auto p-6">
                        <!-- Welcome Section -->
                        <div class="mb-8 p-6 rounded-lg shadow-lg" style="background-color: ${config.secondary_color};">
                            <h2 class="text-2xl font-bold text-white mb-2">¡Bienvenido!</h2>
                            <p class="text-white text-opacity-95">${config.welcome_message}</p>
                        </div>

                        <!-- Stats Cards -->
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                            <div class="stat-card p-4 rounded-lg shadow-lg text-white">
                                <div class="text-3xl mb-2">📊</div>
                                <div class="text-2xl font-bold">${stats.totalRecords}</div>
                                <div class="text-sm opacity-90">Registros Totales</div>
                            </div>
                            <div class="stat-card p-4 rounded-lg shadow-lg text-white">
                                <div class="text-3xl mb-2">🌱</div>
                                <div class="text-2xl font-bold">${stats.viveroRecords}</div>
                                <div class="text-sm opacity-90">Lotes en Vivero</div>
                            </div>
                            <div class="stat-card p-4 rounded-lg shadow-lg text-white">
                                <div class="text-3xl mb-2">🌾</div>
                                <div class="text-2xl font-bold">${stats.siembraRecords}</div>
                                <div class="text-sm opacity-90">Lotes Productivos</div>
                            </div>
                            <div class="stat-card p-4 rounded-lg shadow-lg text-white">
                                <div class="text-3xl mb-2">🌰</div>
                                <div class="text-2xl font-bold">${stats.cosechaRecords}</div>
                                <div class="text-sm opacity-90">Cosechas Registradas</div>
                            </div>
                        </div>

                        <!-- Modules Grid -->
                        <h2 class="text-2xl font-bold mb-4" style="color: ${config.text_color};">Módulos del Sistema</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            ${modules.map(module => `
                                <div class="module-card bg-white p-6 rounded-lg shadow-md" data-module="${module.id}">
                                    <div class="text-4xl mb-3">${module.icon}</div>
                                    <h3 class="text-lg font-bold mb-2" style="color: ${config.text_color};">${module.name}</h3>
                                    <p class="text-sm" style="color: ${config.text_color}; opacity: 0.7;">${module.description}</p>
                                </div>
                            `).join('')}
                        </div>
                    </main>
                </div>
            `;
        }

        function renderModule(moduleId) {
            const config = window.elementSdk?.config || defaultConfig;
            const module = modules.find(m => m.id === moduleId);
            const moduleRecords = allRecords.filter(r => r.module === moduleId);

            return `
                <div class="h-full flex flex-col" style="background-color: ${config.background_color};">
                    <!-- Header -->
                    <header class="shadow-md" style="background-color: ${config.primary_color};">
                        <div class="px-6 py-4 flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <button id="backBtn" class="text-white hover:opacity-80 text-2xl">←</button>
                                <div>
                                    <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                                        <span>${module.icon}</span>
                                        <span>${module.name}</span>
                                    </h1>
                                    <p class="text-white text-opacity-90 text-sm">${module.description}</p>
                                </div>
                            </div>
                            <button id="addRecordBtn" class="px-4 py-2 rounded-lg font-semibold text-white hover:opacity-90" style="background-color: ${config.accent_color};">
                                + Nuevo Registro
                            </button>
                        </div>
                    </header>

                    <!-- Main Content -->
                    <main class="flex-1 overflow-y-auto p-6">
                        <div id="moduleContent">
                            ${moduleRecords.length === 0 ? `
                                <div class="text-center py-12">
                                    <div class="text-6xl mb-4">${module.icon}</div>
                                    <h3 class="text-xl font-semibold mb-2" style="color: ${config.text_color};">No hay registros aún</h3>
                                    <p style="color: ${config.text_color}; opacity: 0.7;">Comienza agregando tu primer registro</p>
                                </div>
                            ` : `
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    ${moduleRecords.map(record => renderRecordCard(record, config)).join('')}
                                </div>
                            `}
                        </div>
                    </main>

                    <!-- Form Modal -->
                    <div id="formModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4" style="z-index: 1000;">
                        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90%] overflow-y-auto">
                            <div class="p-6">
                                <div class="flex justify-between items-center mb-4">
                                    <h2 class="text-2xl font-bold" style="color: ${config.text_color};">Nuevo Registro</h2>
                                    <button id="closeModalBtn" class="text-2xl hover:opacity-70" style="color: ${config.text_color};">×</button>
                                </div>
                                <form id="recordForm" class="space-y-4">
                                    ${renderModuleForm(moduleId, config)}
                                    <div class="flex gap-3 pt-4">
                                        <button type="submit" id="submitBtn" class="flex-1 px-6 py-3 rounded-lg font-semibold text-white hover:opacity-90" style="background-color: ${config.primary_color};">
                                            Guardar
                                        </button>
                                        <button type="button" id="cancelBtn" class="px-6 py-3 rounded-lg font-semibold hover:opacity-90" style="background-color: ${config.background_color}; color: ${config.text_color};">
                                            Cancelar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRecordCard(record, config) {
            return `
                <div class="bg-white p-4 rounded-lg shadow-md hover:shadow-lg transition-shadow">
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="font-bold text-lg" style="color: ${config.text_color};">${record.nombre || record.lote_id || 'Sin nombre'}</h3>
                        <button class="delete-btn text-red-500 hover:text-red-700 text-xl" data-id="${record.__backendId}">×</button>
                    </div>
                    <div class="space-y-1 text-sm" style="color: ${config.text_color}; opacity: 0.8;">
                        ${record.variedad ? `<p><strong>Variedad:</strong> ${record.variedad}</p>` : ''}
                        ${record.fecha ? `<p><strong>Fecha:</strong> ${new Date(record.fecha).toLocaleDateString()}</p>` : ''}
                        ${record.cantidad_plantas ? `<p><strong>Plantas:</strong> ${record.cantidad_plantas}</p>` : ''}
                        ${record.costo ? `<p><strong>Costo:</strong> $${record.costo}</p>` : ''}
                        ${record.responsable ? `<p><strong>Responsable:</strong> ${record.responsable}</p>` : ''}
                        ${record.notas ? `<p><strong>Notas:</strong> ${record.notas}</p>` : ''}
                    </div>
                </div>
            `;
        }

        function renderModuleForm(moduleId, config) {
            const commonFields = `
                <div>
                    <label class="block font-semibold mb-1" style="color: ${config.text_color};">Nombre/ID del Lote *</label>
                    <input type="text" name="nombre" required class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                </div>
            `;

            const forms = {
                vivero: `
                    ${commonFields}
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Especie</label>
                            <input type="text" name="especie" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Variedad</label>
                            <input type="text" name="variedad" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Fecha de Germinación</label>
                            <input type="date" name="fecha" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Proveedor</label>
                            <input type="text" name="proveedor" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">% Germinación</label>
                            <input type="number" name="porcentaje_germinacion" min="0" max="100" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Cantidad de Plantas</label>
                            <input type="number" name="cantidad_plantas" min="0" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                    </div>
                `,
                siembra: `
                    ${commonFields}
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Latitud</label>
                            <input type="text" name="latitud" placeholder="Ej: -12.0464" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Longitud</label>
                            <input type="text" name="longitud" placeholder="Ej: -77.0428" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Variedad</label>
                            <input type="text" name="variedad" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Densidad de Siembra</label>
                            <input type="text" name="densidad_siembra" placeholder="Ej: 1000 plantas/ha" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                    </div>
                    <div>
                        <label class="block font-semibold mb-1" style="color: ${config.text_color};">Marco de Plantación</label>
                        <input type="text" name="marco_plantacion" placeholder="Ej: 3m x 3m" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                    </div>
                `,
                fertilizacion: `
                    ${commonFields}
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Tipo de Fertilizante</label>
                            <input type="text" name="fertilizante" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Dosis</label>
                            <input type="text" name="dosis" placeholder="Ej: 50 kg/ha" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Fecha de Aplicación</label>
                            <input type="date" name="fecha" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Responsable</label>
                            <input type="text" name="responsable" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                    </div>
                    <div>
                        <label class="block font-semibold mb-1" style="color: ${config.text_color};">Costo ($)</label>
                        <input type="number" name="costo" min="0" step="0.01" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                    </div>
                `,
                fitosanitario: `
                    ${commonFields}
                    <div>
                        <label class="block font-semibold mb-1" style="color: ${config.text_color};">Plaga/Enfermedad Detectada</label>
                        <input type="text" name="plaga_enfermedad" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Producto Aplicado</label>
                            <input type="text" name="producto" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Dosis</label>
                            <input type="text" name="dosis" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Fecha</label>
                            <input type="date" name="fecha" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Responsable</label>
                            <input type="text" name="responsable" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                    </div>
                    <div>
                        <label class="block font-semibold mb-1" style="color: ${config.text_color};">Costo ($)</label>
                        <input type="number" name="costo" min="0" step="0.01" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                    </div>
                `,
                poda: `
                    ${commonFields}
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Tipo de Poda</label>
                            <select name="tipo_poda" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                                <option value="">Seleccionar...</option>
                                <option value="formacion">Formación</option>
                                <option value="mantenimiento">Mantenimiento</option>
                                <option value="sanitaria">Sanitaria</option>
                                <option value="renovacion">Renovación</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Fecha</label>
                            <input type="date" name="fecha" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Responsable</label>
                            <input type="text" name="responsable" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Costo ($)</label>
                            <input type="number" name="costo" min="0" step="0.01" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                    </div>
                `,
                cosecha: `
                    ${commonFields}
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Peso Fresco (kg)</label>
                            <input type="number" name="peso_fresco" min="0" step="0.01" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Nº Mazorcas</label>
                            <input type="number" name="num_mazorcas" min="0" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Rendimiento Seco (kg)</label>
                            <input type="number" name="rendimiento_seco" min="0" step="0.01" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Fecha de Cosecha</label>
                            <input type="date" name="fecha" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Variedad</label>
                            <input type="text" name="variedad" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                    </div>
                    <div>
                        <label class="block font-semibold mb-1" style="color: ${config.text_color};">Costo de Recolección ($)</label>
                        <input type="number" name="costo" min="0" step="0.01" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                    </div>
                `,
                postcosecha: `
                    ${commonFields}
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Temperatura (°C)</label>
                            <input type="text" name="temperatura" class="w-full px-3 py-2 border rounded-lg" style="border-color: ${config.secondary_color};">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1" style="color: ${config.text_color};">Humedad (%)</label>

        function calculateStats() {
            return {
                totalRecords: allRecords.length,
                viveroRecords: allRecords.filter(r => r.module === 'vivero').length,
                siembraRecords: allRecords.filter(r => r.module === 'siembra').length,
                cosechaRecords: allRecords.filter(r => r.module === 'cosecha').length
            };
        }

        function attachEventListeners() {
            document.querySelectorAll('.module-card').forEach(card => {
                card.addEventListener('click', () => {
                    currentModule = card.dataset.module;
                    currentView = 'module';
                    renderCurrentView();
                });
            });

            const backBtn = document.getElementById('backBtn');
            if (backBtn) {
                backBtn.addEventListener('click', () => {
                    currentView = 'dashboard';
                    currentModule = null;
                    renderCurrentView();
                });
            }

            const addRecordBtn = document.getElementById('addRecordBtn');
            if (addRecordBtn) {
                addRecordBtn.addEventListener('click', () => {
                    document.getElementById('formModal').classList.remove('hidden');
                });
            }

            const closeModalBtn = document.getElementById('closeModalBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            if (closeModalBtn) {
                closeModalBtn.addEventListener('click', () => {
                    document.getElementById('formModal').classList.add('hidden');
                });
            }
            if (cancelBtn) {
                cancelBtn.addEventListener('click', () => {
                    document.getElementById('formModal').classList.add('hidden');
                });
            }

            const recordForm = document.getElementById('recordForm');
            if (recordForm) {
                recordForm.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    if (allRecords.length >= 999) {
                        showToast('Límite alcanzado: máximo 999 registros. Por favor elimina algunos registros primero.', 'error');
                        return;
                    }

                    const submitBtn = document.getElementById('submitBtn');
                    const originalText = submitBtn.textContent;
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<div class="loading-spinner mx-auto"></div>';

                    const formData = new FormData(e.target);
                    const data = {
                        module: currentModule,
                        created_at: new Date().toISOString()
                    };

                    formData.forEach((value, key) => {
                        if (value) {
                            if (key === 'costo' || key === 'cantidad' || key === 'porcentaje_germinacion' ||
                                key === 'cantidad_plantas' || key === 'peso_fresco' || key === 'num_mazorcas' ||
                                key === 'rendimiento_seco' || key === 'jornales' || key === 'horas_uso') {
                                data[key] = parseFloat(value);
                            } else {
                                data[key] = value;
                            }
                        }
                    });

                    const result = await window.dataSdk.create(data);

                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;

                    if (result.isOk) {
                        document.getElementById('formModal').classList.add('hidden');
                        e.target.reset();
                        showToast('Registro guardado exitosamente', 'success');
                    } else {
                        showToast('Error al guardar el registro. Por favor intenta de nuevo.', 'error');
                    }
                });
            }

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const recordId = btn.dataset.id;
                    const record = allRecords.find(r => r.__backendId === recordId);

                    if (record) {
                        const originalText = btn.textContent;
                        btn.textContent = '⏳';
                        btn.disabled = true;

                        const result = await window.dataSdk.delete(record);

                        if (!result.isOk) {
                            btn.textContent = originalText;
                            btn.disabled = false;
                            showToast('Error al eliminar el registro', 'error');
                        } else {
                            showToast('Registro eliminado', 'success');
                        }
                    }
                });
            });
        }

        function showToast(message, type = 'info') {
            const config = window.elementSdk?.config || defaultConfig;
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? '#ef4444' : type === 'success' ? '#10b981' : config.primary_color;

            toast.className = 'fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white font-semibold z-50';
            toast.style.backgroundColor = bgColor;
            toast.textContent = message;

            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function onConfigChange(config) {
            const appTitle = document.querySelector('header h1');
            if (appTitle) {
                appTitle.textContent = config.app_title || defaultConfig.app_title;
            }

            const farmName = document.querySelector('header p');
            if (farmName) {
                farmName.textContent = config.farm_name || defaultConfig.farm_name;
            }

            const welcomeMessage = document.querySelector('.mb-8 p');
            if (welcomeMessage) {
                welcomeMessage.textContent = config.welcome_message || defaultConfig.welcome_message;
            }

            document.querySelectorAll('header').forEach(el => {
                el.style.backgroundColor = config.primary_color || defaultConfig.primary_color;
            });

            document.body.style.backgroundColor = config.background_color || defaultConfig.background_color;

            document.querySelectorAll('h1, h2, h3, p, label').forEach(el => {
                if (!el.classList.contains('text-white')) {
                    el.style.color = config.text_color || defaultConfig.text_color;
                }
            });
        }

        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange,
                mapToCapabilities: (config) => ({
                    recolorables: [
                        {
                            get: () => config.primary_color || defaultConfig.primary_color,
                            set: (value) => {
                                config.primary_color = value;
                                window.elementSdk.setConfig({ primary_color: value });
                            }
                        },
                        {
                            get: () => config.secondary_color || defaultConfig.secondary_color,
                            set: (value) => {
                                config.secondary_color = value;
                                window.elementSdk.setConfig({ secondary_color: value });
                            }
                        },
                        {
                            get: () => config.background_color || defaultConfig.background_color,
                            set: (value) => {
                                config.background_color = value;
                                window.elementSdk.setConfig({ background_color: value });
                            }
                        },
                        {
                            get: () => config.text_color || defaultConfig.text_color,
                            set: (value) => {
                                config.text_color = value;
                                window.elementSdk.setConfig({ text_color: value });
                            }
                        },
                        {
                            get: () => config.accent_color || defaultConfig.accent_color,
                            set: (value) => {
                                config.accent_color = value;
                                window.elementSdk.setConfig({ accent_color: value });
                            }
                        }
                    ],
                    borderables: [],
                    fontEditable: undefined,
                    fontSizeable: undefined
                }),
                mapToEditPanelValues: (config) => new Map([
                    ["app_title", config.app_title || defaultConfig.app_title],
                    ["farm_name", config.farm_name || defaultConfig.farm_name],
                    ["welcome_message", config.welcome_message || defaultConfig.welcome_message]
                ])
            });
        }

        initApp();
    </script>
